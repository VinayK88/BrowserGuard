name: BrowserGuard CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10','3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[api]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_baseline.py
      - run: browserguard > /tmp/browserguard-report.json
      - run: python -c "from browserguard.api import app; assert any(r.path == '/extensions/{ext_id}' for r in app.routes)"
      - run: python -c "from browserguard.report import build_report; r=build_report(); assert r['summary']['ml_model']=='IsolationForest'"
      - run: python -m compileall browserguard
